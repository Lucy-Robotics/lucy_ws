name: Nightly E2E on dev

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run Install, Build & Test on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run install-and-launch.yml -R "$GITHUB_REPOSITORY" --ref dev
